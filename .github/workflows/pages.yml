name: Deploy static game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore reviewed source archive
        run: |
          echo '9cd505065de7443fb22e7fa7f6fd171b9d4b9c8e61e41806ea2b006792de8d96  taiwan-food-adventure-source-v0.1.0.zip' | sha256sum --check
          unzip -q taiwan-food-adventure-source-v0.1.0.zip -d build-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build-source/taiwan-food-adventure/package-lock.json
      - run: npm ci
        working-directory: build-source/taiwan-food-adventure
      - run: npm test
        working-directory: build-source/taiwan-food-adventure
      - run: npm run build
        working-directory: build-source/taiwan-food-adventure
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-source/taiwan-food-adventure/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

